<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Invited | The Vibe 2026</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --accent: #8b5cf6;
            --glass: rgba(255, 255, 255, 0.05);
            --text: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }

        body {
            background-color: var(--bg-color);
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background Orb */
        .orb {
            position: fixed;
            width: 400px;
            height: 400px;
            background: var(--accent);
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.2;
            animation: move 10s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-20%, -20%); }
            to { transform: translate(20%, 20%); }
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 { font-size: 2.5rem; letter-spacing: -1px; margin-bottom: 0.5rem; }
        p.subtitle { color: #94a3b8; margin-bottom: 2rem; }

        .details {
            text-align: left;
            margin-bottom: 2rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            border-radius: 16px;
        }

        .detail-item { margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; }
        .detail-item:last-child { margin-bottom: 0; }

        .rsvp-btn {
            display: inline-block;
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: white;
            text-decoration: none;
            font-weight: 600;
            border-radius: 12px;
            transition: transform 0.2s, background 0.2s;
        }

        .rsvp-btn:hover {
            transform: translateY(-2px);
            background: #7c3aed;
        }

        .rsvp-btn:active { transform: translateY(0); }

    </style>
</head>
<body>
    <div class="orb"></div>

    <div class="container">
        <h1>House Party</h1>
        <p class="subtitle">A night of bad decisions and great music.</p>
        
        <div class="details">
            <div class="detail-item">📅 <span>March 28th, 2026</span></div>
            <div class="detail-item">⏰ <span>9:00 PM - Late</span></div>
            <div class="detail-item">📍 <span>123 Vibe Street, Downtown</span></div>
        </div>

        <a href="#" class="rsvp-btn">RSVP BY MARCH 20</a>
    </div>
</body>
