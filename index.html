<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party @ Julie's | 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020617;
            --accent: #c084fc; 
            --accent-glow: #7c3aed;
            --glass: rgba(255, 255, 255, 0.03);
            --text: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .orb {
            position: fixed;
            width: 450px;
            height: 450px;
            background: var(--accent-glow);
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.25;
            top: -10%;
            left: -10%;
            animation: drift 12s infinite alternate ease-in-out;
        }

        .orb2 {
            position: fixed;
            width: 350px;
            height: 350px;
            background: #22d3ee; 
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.15;
            bottom: -5%;
            right: -5%;
            animation: drift 18s infinite alternate-reverse ease-in-out;
        }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(40px, 60px) scale(1.1); }
        }

        .container {
            width: 90%;
            max-width: 420px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem 2rem;
            border-radius: 32px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { font-size: 3rem; font-weight: 900; letter-spacing: -2px; line-height: 1; margin-bottom: 0.5rem; }
        .highlight { color: var(--accent); }
        
        p.subtitle { color: #94a3b8; margin-bottom: 2rem; font-size: 1.1rem; }

        .details-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-line { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 1rem; }
        .detail-line:last-child { margin-bottom: 0; }
        .icon { font-size: 1.2rem; }

        #countdown {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 1.5rem;
            background: rgba(192, 132, 252, 0.1);
            padding: 8px;
            border-radius: 10px;
            display: inline-block;
        }

        .rsvp-btn {
            display: block;
            width: 100%;
            padding: 1.2rem;
            background: var(--accent);
            color: #000;
            text-decoration: none;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.4);
        }

        .rsvp-btn:hover {
            transform: scale(1.02);
            background: #fff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
        }

        .footer-note { font-size: 0.8rem; color: #64748b; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="orb"></div>
    <div class="orb2"></div>

    <div class="container">
        <div id="countdown">Calculating...</div>
        <h1>THE <span class="highlight">PARTY.</span></h1>
        <p class="subtitle">Julie's House Party — You're on the list.</p>
        
        <div class="details-box">
            <div class="detail-line">
                <span class="icon">📅</span> 
                <span>Saturday, March 28, 2026</span>
            </div>
            <div class="detail-line">
                <span class="icon">⏰</span> 
                <span>9:00 PM – Late</span>
            </div>
            <div class="detail-line">
                <span class="icon">📍</span> 
                <span>123 Vibe Street, Los Angeles</span>
            </div>
        </div>

        <a href="https://forms.gle/KNYCpWavogQw8Uet5" target="_blank" class="rsvp-btn">RSVP HERE</a>
        
        <p class="footer-note">Bring your best energy. See you there!</p>
    </div>

    <script>
        const partyDate = new Date("March 28, 2026 21:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = partyDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerHTML = days + "d " + hours + "h " + minutes + "m " + seconds + "s";

            if (distance < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "LIVE NOW";
            }
        }, 1000);
    </script>
</body>
</html>
